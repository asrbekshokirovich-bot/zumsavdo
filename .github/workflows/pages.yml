# Panelni GitHub Pages ga chiqarish.
#
# `main` ga har surilganda qayta yigʻiladi va joylanadi. Qoʻlda ham ishga
# tushirsa boʻladi (workflow_dispatch) — masalan kalit almashtirilgandan
# keyin qayta yigʻish kerak boʻlsa.
name: Panelni joylash

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages ga yozish uchun shu ikkisi kerak.
permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtda bitta joylash. Ketma-ket ikki surish boʻlsa, oxirgisi
# yakunlanadi — oʻrtadagisi bekor qilinadi, chunki u baribir eskirgan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ombor manzili `.env.production` da — u omborda turadi va hech
      # qanday sozlash talab qilmaydi. Kalit `sb_publishable_`, yaʻni
      # Supabase uni aynan brauzerga berish uchun beradi.
      #
      # Secrets qoʻyilgan boʻlsa oʻsha ustun turadi: kalitni omborni
      # oʻzgartirmasdan almashtirish yoki boshqa bazaga ulash mumkin
      # boʻlsin.
      # Secrets faqat QOʻYILGAN boʻlsa muhitga chiqariladi.
      #
      # Ilgari ular toʻgʻridan-toʻgʻri `env:` ga yozilgandi va bu birinchi
      # urinishni yiqitdi: secret qoʻyilmagan boʻlsa GitHub uni BOʻSH SATR
      # qilib beradi, Vite esa muhit oʻzgaruvchisini `.env.production` dan
      # ustun qoʻyadi — boʻsh boʻlsa ham. Natijada ombor manzili bundle ga
      # umuman tushmadi.
      #
      # `$GITHUB_ENV` ga faqat boʻsh boʻlmaganda yoziladi, shuning uchun
      # secret yoʻq boʻlsa `.env.production` oʻz ishini qiladi.
      - name: Secrets qoʻyilgan boʻlsa ularni ishlatish
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ]; then
            echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
            echo "Ombor manzili secrets dan olindi."
          fi
          if [ -n "$KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Kalit secrets dan olindi."
          fi

      - name: Yigʻish
        env:
          # Pages loyihani `/<ombor-nomi>/` ostida beradi.
          ZUMSAVDO_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Kirishni emas, NATIJANI tekshiramiz.
      #
      # Kalit borligini tekshirish yetarli emas edi: u qoʻyilgan boʻlsa
      # ham yigʻishga tushmay qolishi mumkin. Yigʻilgan JS ichida ombor
      # manzili bormi — savol shu, va javobi bir xil aniq.
      #
      # Boʻlmasa joylash toʻxtatiladi: ombor manzilisiz panel joylansa,
      # ekranda sababsiz "Ombor sozlanmagan" turardi.
      - name: Ombor manzili yigʻilganini tekshirish
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::Yigʻilgan panelda ombor manzili yoʻq."
            echo ".env.production faylini yoki Actions secrets ni tekshiring."
            exit 1
          fi
          echo "Ombor manzili joyida."

      # Pages statik server: `/sotuvchi/9103` degan fayl yoʻq va u 404
      # qaytaradi. SPA da bu manzilni brauzerning oʻzi hal qiladi, shuning
      # uchun 404 sahifasi ham oʻsha ilovaning oʻzi boʻlishi kerak.
      - name: SPA uchun 404 sahifasi
        run: cp dist/index.html dist/404.html

      # Jekyll `_` bilan boshlanadigan fayllarni tashlab yuboradi.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Pages hali yoqilmagan boʻlsa workflow oʻzi yoqadi — sozlamalarga
          # kirib tugma bosish shart emas.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
