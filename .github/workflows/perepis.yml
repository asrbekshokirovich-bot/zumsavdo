# Perepis — katalogni id boʻyicha aylanib chiqish.
#
# Nega jadval bilan. Perepis 19-avgustda boshlangan va 24-avgustga
# kelib 84,85% da turibdi. Sabab kodda emas: u faqat kompyuter yoniq
# va buyruq qoʻlda ishga tushirilgan paytda yuradi. Ikki kun tanaffus
# — ikki kun yoʻqolgan vaqt.
#
# NEGA PARALLELLIK OSHIRILMADI. `census.mjs` da ochiq oʻlchov yozilgan:
# 12 ta parallel soʻrovda 429 chiqmagan, tezlik ~26 soʻrov/sek, va
# "bundan yuqorisi sinalmagan — Uzum uzoq bloklashi mumkin, u holda
# perepis tezlashmaydi, TOʻXTAYDI". Xatoning narxi simmetrik emas:
# tezlashtirishdan yutuq bir necha soat, bloklanishdan zarar butun
# loyihaning asosi. Tezlik uzluksizlikdan keladi, siqishdan emas.
#
# 2026-09-02 da parallellik AKSINCHA kamaytirildi — 12 dan 6 ga.
# Sabab Uzum emas, oʻz bazamiz: perepis yozuvlari panelning
# keshini siqib chiqarardi va panel birinchi urinishda ochilmasdi.
# Tafsiloti pastda, `ZUMSAVDO_CENSUS_CONCURRENCY` yonida.
#
# `--minutes 300` — ish oʻzi toza tugaydi. Bunsiz `census.mjs` bitta
# boʻlak bajarib toʻxtaydi; GitHub esa 6 soatdan keyin jarayonni
# qoʻpol uzadi va yugurish qizil boʻlardi.
name: Perepis

on:
  schedule:
    # Har 6 soatda. Perepis tugagach birinchi qadam ishni oʻtkazib
    # yuboradi — yaʼni bekorga soʻrov yuborilmaydi.
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: perepis
  cancel-in-progress: false

jobs:
  perepis:
    runs-on: ubuntu-latest
    # 270 daqiqalik oyna + 30 daqiqa zaxira (npm ci, holat, tanlov).
    # Ilgari 330 edi va boʻlak undan oshib ketardi.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Sir borligini tekshirish
        run: |
          if [ -z "${{ secrets.ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY yoʻq."
            exit 1
          fi
          if [ -z "${{ secrets.ZUMSAVDO_SUPABASE_URL }}" ]; then
            echo "::error::ZUMSAVDO_SUPABASE_URL yoʻq."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: npm ci
        working-directory: ingest

      - name: Davom etish kerakmi
        id: holat
        working-directory: ingest
        env:
          ZUMSAVDO_SUPABASE_URL: ${{ secrets.ZUMSAVDO_SUPABASE_URL }}
          ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY }}
          # Oʻtishlar orasidagi eng kam tanaffus.
          #
          # Perepis TUGAMAYDI — u aylanadi. `zs_census_claim` oxirga
          # yetganda `pass` ni bittaga oshirib, `next_id` ni 1 ga
          # qaytaradi. Yaʼni har oʻtish oxirida savol tugʻiladi:
          # katalogni yana boshidan chiqishga 3,3 mln soʻrov kerak,
          # buni jimgina boshlab yuborish notoʻgʻri.
          #
          # ILGARI bu savol QOʻLDA hal qilinardi: darvoza oxirgi ruxsat
          # etilgan oʻtish raqamida turardi (`pass -gt N`). Naqsh ikki
          # marta bir xil zarar keltirdi — 2026-08-24 da 9 kun,
          # 2026-09-03 da 54 soat perepis jimgina toʻxtab turdi va
          # yugurishlar YASHIL koʻrindi, chunki qadam oʻtkazib
          # yuborilardi.
          #
          # ENDI raqam emas, RITM cheklanadi. Oʻtish boshlangan boʻlsa
          # hech qanday darvoza yoʻq — davom etadi. Faqat oxiriga
          # yetganda (`next_id > max_id`) tanaffus tekshiriladi.
          #
          # 24 soat qayerdan: 6 parallelda bitta toʻliq oʻtish ~2,4 kun
          # (19,6 id/sek, oʻlchandi 2026-09-03). 24 soat tanaffus bilan
          # tsikl ~3,4 kun — katalog haftada ikki marta yangilanadi va
          # baza doim tinch oynaga ega boʻladi.
          ZUMSAVDO_PASS_COOLDOWN_HOURS: "24"
        run: |
          javob=$(node census.mjs --status)
          echo "$javob"
          # JSON python bilan oʻqiladi, sed bilan emas: `updated_at`
          # sana, eski `sed` esa faqat raqam ajrata olardi.
          printf '%s' "$javob" > /tmp/holat.json
          python3 -c "import json,datetime;d=json.load(open('/tmp/holat.json'));u=datetime.datetime.fromisoformat(d['updated_at']);print('pass=%d\nnext_id=%d\nmax_id=%d\nseen=%d\nyosh_soat=%d'%(d['pass'],d['next_id'],d['max_id'],d['seen'],(datetime.datetime.now(datetime.timezone.utc)-u).total_seconds()//3600))" > /tmp/holat.env
          cat /tmp/holat.env
          . /tmp/holat.env
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "seen=$seen" >> "$GITHUB_OUTPUT"

          if [ "$next_id" -le "$max_id" ]; then
            echo "Oʻtish $pass davom etyapti (id $next_id / $max_id)."
            echo "davom=ha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Oʻtish oxiriga yetgan. Tanaffus tugadimi?
          kerak="$ZUMSAVDO_PASS_COOLDOWN_HOURS"
          echo "Oʻtish $pass tugagan. Oxirgi yozuvdan $yosh_soat soat oʻtdi (kerak: $kerak)."
          if [ "$yosh_soat" -ge "$kerak" ]; then
            echo "Tanaffus tugadi — $((pass + 1))-oʻtish boshlanadi."
            echo "davom=ha" >> "$GITHUB_OUTPUT"
          else
            # OGOHLANTIRISH, jim yashil emas. Bu holat KUTILGAN va
            # oʻzi ochiladi, lekin yugurish xulosasida koʻrinishi kerak
            # — aks holda "toʻxtab qolgan" va "tanaffusda" bir xil
            # koʻrinadi.
            echo "::warning::Perepis tanaffusda: $pass-oʻtish tugagan, keyingisi $kerak soatdan keyin boshlanadi (hozir $yosh_soat soat)."
            echo "davom=yoq" >> "$GITHUB_OUTPUT"
          fi

      - name: Aylanish
        if: steps.holat.outputs.davom == 'ha'
        working-directory: ingest
        env:
          ZUMSAVDO_SUPABASE_URL: ${{ secrets.ZUMSAVDO_SUPABASE_URL }}
          ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY }}
          # 12 EMAS, 6. Sabab Uzumda emas, OʻZ BAZAMIZDA.
          #
          # `census.mjs` dagi 12 raqami Uzum tomonidan tanlangan:
          # 429 chiqmagan, ~26 soʻrov/sek. U oʻlchov oʻrinli va kod
          # standarti oʻzgarmadi.
          #
          # Lekin perepis oʻz bazamizga ham yozadi va bugun (2026-09-02)
          # `zumsavdo.product` olti soatda 2 013 213 dan 2 218 695
          # qatorga oʻsdi. Bu yozuvlar panelning sahifalarini
          # `shared_buffers` dan siqib chiqaradi, va foydalanuvchi
          # panelni ochganda soʻrov diskdan oʻqishga majbur boʻladi:
          #
          #   birinchi urinish  HTTP 500, 3 852–4 686 ms
          #   ikkinchi urinish  HTTP 200, 1 942 ms
          #   uchinchi urinish  HTTP 200,   708 ms
          #
          # Yaʼni "panel ochilmadi, yangilasam ochildi". Baza ichida
          # oʻsha soʻrov atigi 360 ms — gap soʻrovda emas, keshda.
          #
          # NARXI: perepis taxminan ikki barobar uzoq davom etadi.
          # Nazoratchi shuni tanladi (2026-09-02) — panel ishlashi
          # perepis tezligidan muhimroq. `anon` byudjeti ham
          # oshirildi (`20260902213000` migratsiyasi); ikkalasi
          # birga ishlaydi.
          ZUMSAVDO_CENSUS_CONCURRENCY: "6"
          # Boʻlak 200 000 emas, 50 000.
          #
          # Muddat faqat boʻlaklar ORASIDA tekshiriladi. 200 000 lik
          # boʻlak 6 parallelda ~170 daqiqa oladi, yaʼni oynaning
          # oxirida boshlangan boʻlak undan ~170 daqiqa oshib ketardi
          # va GitHub jarayonni uzardi. 50 000 lik boʻlak ~42 daqiqa —
          # oynaga ancha aniq sigʻadi.
          #
          # `census.mjs` endi keyingi boʻlakning muddatini oʻlchangan
          # tezlikdan bashorat qiladi va sigʻmasa boshlamaydi. Kichik
          # boʻlak oʻsha bashoratni aniqroq qiladi va oynani toʻliqroq
          # ishlatadi: 270 daqiqada oltita boʻlak ~250 daqiqa.
          ZUMSAVDO_CENSUS_CHUNK: "50000"
        run: node census.mjs --size 50000 --minutes 270

      # "Ishladi" degani "oldinga siljidi" degani emas.
      #
      # Tekshiruv `seen` boʻyicha, `foiz` boʻyicha EMAS. `foiz`
      # `next_id` dan hisoblanadi, `next_id` esa boʻlak BAND
      # QILINGANDA siljiydi — yaʼni bitta ham id tekshirilmasa ham
      # oldinga ketadi. `seen` faqat haqiqatan tekshirilgan id ni
      # sanaydi.
      - name: Oldinga siljidimi
        if: steps.holat.outputs.davom == 'ha'
        working-directory: ingest
        env:
          ZUMSAVDO_SUPABASE_URL: ${{ secrets.ZUMSAVDO_SUPABASE_URL }}
          ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          javob=$(node census.mjs --status)
          echo "$javob"
          oqi() { printf '%s' "$javob" | sed -n "s/.*\"$1\":\"\\?\\([0-9.]*\\)\"\\?.*/\\1/p"; }
          pass=$(oqi pass); seen=$(oqi seen)
          eski_pass="${{ steps.holat.outputs.pass }}"
          eski_seen="${{ steps.holat.outputs.seen }}"
          echo "Oldin: pass $eski_pass, seen $eski_seen"
          echo "Keyin: pass $pass, seen $seen"
          # Yangi oʻtish boshlansa `seen` nolga tushadi — bu ham siljish.
          if [ "$pass" -gt "$eski_pass" ] || [ "$seen" -gt "$eski_seen" ]; then
            echo "Perepis oldinga siljidi."
          else
            echo "::error::Perepis qimirlamadi (seen $eski_seen → $seen)."
            exit 1
          fi

      # Kuzatuv roʻyxatini yangilash — oʻtish TUGAGANDA.
      #
      # NEGA BU YERDA. Perepis 1-qatlam: butun katalogni koʻradi.
      # Sweep esa 2-qatlam: undan tanlangan 50 000 tovarni kuniga uch
      # marta oʻlchaydi. Ikkisini bogʻlaydigan halqa — `--select`.
      #
      # Va oʻsha halqa YOʻQ EDI. Roʻyxat 2026-08-18 da bir marta
      # qoʻlda tanlangan va shundan beri qimirlamagan: `tracked_product`
      # da 08-18 dan keyin bitta ham yangi qator yoʻq. Yaʼni perepis
      # uch marta butun katalogni aylanib chiqqan, 2,5 mln tovarni
      # koʻrgan — va sweep hamon eng birinchi, TOʻLIQ BOʻLMAGAN
      # oʻtishdan tanlangan roʻyxatni oʻlchab yurgan.
      #
      # "Baza toʻlmayapti" degan savolning asosiy javobi shu edi.
      #
      # NEGA AYNAN OʻTISH TUGAGANDA. Tanlov `buyers_per_week` boʻyicha
      # saralaydi. Toʻliq boʻlmagan oʻtishda katalogning faqat bir
      # boʻlagi koʻrilgan boʻladi va roʻyxat oʻsha boʻlakka qarab
      # qiyshayadi. `zs_select_tracked` buni oʻzi ham tekshiradi
      # (`20260905060000` migratsiyasi), lekin bu yerda ham shart
      # qoʻyilgan — ikkita himoya bittasidan yaxshi.
      - name: Kuzatuv roʻyxatini yangilash
        if: steps.holat.outputs.davom == 'ha'
        working-directory: ingest
        env:
          ZUMSAVDO_SUPABASE_URL: ${{ secrets.ZUMSAVDO_SUPABASE_URL }}
          ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZUMSAVDO_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          javob=$(node census.mjs --status)
          printf '%s' "$javob" > /tmp/holat2.json
          python3 -c "import json;d=json.load(open('/tmp/holat2.json'));print('next_id=%d\nmax_id=%d\npass=%d'%(d['next_id'],d['max_id'],d['pass']))" > /tmp/holat2.env
          . /tmp/holat2.env
          if [ "$next_id" -le "$max_id" ]; then
            echo "Oʻtish $pass hali tugamagan (id $next_id / $max_id) — tanlov keyingi safar."
            exit 0
          fi
          echo "Oʻtish $pass tugadi — kuzatuv roʻyxati qayta tanlanadi."
          natija=$(node census.mjs --select 50000)
          echo "$natija"
          # Tanlov jimgina oʻtkazib yuborilmasin: funksiya himoya
          # ishlaganda `sabab` qaytaradi va `qoshildi` nol boʻladi.
          if printf '%s' "$natija" | grep -q '"sabab":null'; then
            echo "Roʻyxat yangilandi."
          else
            echo "::warning::Kuzatuv roʻyxati yangilanmadi — javobdagi sababni koʻring."
          fi
